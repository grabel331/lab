<!DOCTYPE html>
<html lang="pt-BR">

    <script>
    // Se não houver token salvo, expulsa de volta para o login
    if (!localStorage.getItem('supabase_token')) {
        window.location.href = 'index.html';
    }
</script>
<head>
    <meta charset="UTF-8">
    <title>Laboratório - Secreto</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 2rem; border-radius: 8px; border: 1px solid #30363d; }
        button { padding: 8px 16px; background: #da3633; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #b31d1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao seu Laboratório Secreto!</h1>
        <p>Este conteúdo só é carregado e lido após a autenticação bem-sucedida.</p>
        <br>
        <button id="logout-btn">Sair (Logout)</button>
    </div>

    <script>
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('supabase_token');
            window.location.reload();
        });
    </script>
</body>
</html>
